name: Tests, imágenes y deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests de la API
        working-directory: apps/api
        run: uv sync --frozen && uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Tipos de la web
        working-directory: apps/web
        run: npm ci && npx tsc --noEmit

  imagenes:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gyrfinanzas-api:latest
            ghcr.io/${{ github.repository_owner }}/gyrfinanzas-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Imagen de la web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gyrfinanzas-web:latest
            ghcr.io/${{ github.repository_owner }}/gyrfinanzas-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Entra al servidor SOLO a la carpeta de gyrfinanzas y actualiza ese proyecto.
  # Se saltea mientras no estén los secretos DEPLOY_HOST, DEPLOY_USER y DEPLOY_KEY.
  deploy:
    needs: imagenes
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Actualizar gyrfinanzas en el servidor
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ~/apps/gyrfinanzas
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            cd deploy
            docker compose pull --quiet
            docker compose up -d --remove-orphans
            docker compose ps
      - name: Sin servidor configurado
        if: env.DEPLOY_HOST == ''
        run: echo "Imágenes publicadas. Falta configurar los secretos DEPLOY_* para el deploy automático."
