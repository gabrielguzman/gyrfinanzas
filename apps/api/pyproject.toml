[project]
name = "gyrfinanzas-api"
version = "0.1.0"
description = "API de gyrfinanzas"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdf>=5.0",
]

[dependency-groups]
dev = ["pytest>=8", "fpdf2>=2.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
